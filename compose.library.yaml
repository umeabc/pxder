services:
  pxder:
    environment:
      PXDER_LIBRARY_DIR: /library
    volumes:
      - type: bind
        source: ${PXDER_LIBRARY_HOST_DIR:?Set PXDER_LIBRARY_HOST_DIR to the existing server image directory}
        target: /library
        read_only: true
        bind:
          create_host_path: false
