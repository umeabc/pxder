services:
  pxder:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PXDER_PASSWORD: ${PXDER_PASSWORD:?Set PXDER_PASSWORD in .env before starting}
      PXDER_ORIGIN: ${PXDER_ORIGIN:-}
      PXDER_PIXIV_TOKEN: ${PXDER_PIXIV_TOKEN:-}
    ports:
      - "127.0.0.1:${PXDER_PORT:-8080}:8080"
    volumes:
      - pxder-data:/data
      - pxder-downloads:/downloads
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pxder-data:
  pxder-downloads:
